<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncStride</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <!-- Fonts & Libraries -->
  <link href="https://fonts.googleapis.com/css?family=Roboto+Mono" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/script.js"></script>
</head>

<body>
  <div class="container" style="display: flex; flex-direction: column; align-items: center; max-width: 1200px; margin: auto;">
    <div class="status widget" style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
      <button id="pairButton" style="flex: 1; margin-right: 10px;">CONNECT</button>
      <div id="status_text" style="flex: 2; text-align: center;">Click the connect button to connect your device</div>
      <button id="calibrateButton" style="flex: 1; margin-left: 10px;">CALIBRATE</button>
    </div>

    <div class="merged-widget widget" style="width: 100%; margin-top: 20px;">
      <div class="label" style="text-align: center; margin-bottom: 10px;">Human Arm Motion</div>
      
      <div class="top-section" style="display: flex; justify-content: space-between; align-items: center;">
        <canvas id="gyroscopeChart" class="doublegraph" style="flex: 1; margin-right: 20px;"></canvas>
        <div class="text-data" style="flex: 1; margin-right: 20px; text-align: center;">
          <div class="angle-display">
            <span id="armAngle">Arm Angle: 0°</span>
          </div>
          <div class="battery-display">
            <span id="batteryPercentage">Battery: 100%</span>
          </div>
        </div>
        <div id="humanModel" style="flex: 1; width: 100%; height: 400px;"></div>
      </div>
    </div>
  </div>
</body>

</html>
