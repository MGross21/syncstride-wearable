<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncStride</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <!-- Fonts & Libraries -->
  <link href="https://fonts.googleapis.com/css?family=Roboto+Mono" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/script.js"></script>
</head>

<body>
  <div class="container">
    <div class="status widget">
      <button id="pairButton">CONNECT</button>
      <div id="status_text" data-default="Click the connect button to connect your device"></div>
      <button id="calibrateButton">CALIBRATE</button>
    </div>

    <div class="merged-widget widget">
      <div class="label">Human Arm Motion</div>
      
      <div class="top-section">
        <canvas id="pitchChart"></canvas>
        <div class="text-data">
          <div class="battery-display">
            <span id="batteryPercentage">Battery: 100%</span>
          </div>
          <div class="angle-display">
            <span id="armAngle">Arm Angle: 0°</span>
          </div>
        </div>
        <canvas id="humanModel"></canvas>
      </div>
    </div>
  </div>
</body>

</html>
